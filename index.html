<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>County Compare</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: results table + movers on the left, county map with hover card on the right, sources below. Utilitarian election-night UI. */
:root{
  --bg:#f6f6f4; --panel:#ffffff; --ink:#15171a; --muted:#5d6470; --line:#dcdde0;
  --rep:#b3180f; --dem:#1737b8; --accent:#15171a; --accent-ink:#ffffff; --hl:#fff1a8;
  --r1:#e9c2bd; --r2:#d98f87; --r3:#c4584e; --r4:#a51a10;
  --d1:#c3cbea; --d2:#8f9fdc; --d3:#5a70c8; --d4:#1a3cb8;
  --nodata:#e5e5e5; --stroke:#ffffff;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1114; --panel:#181b20; --ink:#eceef1; --muted:#9aa2ae; --line:#2b3037;
  --rep:#ef6a5f; --dem:#7f97f2; --accent:#eceef1; --accent-ink:#0f1114; --hl:#4a4217;
  --r1:#5a2d29; --r2:#8a3c35; --r3:#bd4f45; --r4:#e5665a;
  --d1:#2b3560; --d2:#3d519a; --d3:#566fd0; --d4:#8aa0ff;
  --nodata:#2a2d33; --stroke:#181b20; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1114; --panel:#181b20; --ink:#eceef1; --muted:#9aa2ae; --line:#2b3037;
  --rep:#ef6a5f; --dem:#7f97f2; --accent:#eceef1; --accent-ink:#0f1114; --hl:#4a4217;
  --r1:#5a2d29; --r2:#8a3c35; --r3:#bd4f45; --r4:#e5665a;
  --d1:#2b3560; --d2:#3d519a; --d3:#566fd0; --d4:#8aa0ff;
  --nodata:#2a2d33; --stroke:#181b20; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;font-weight:700;text-wrap:balance;line-height:1.05}
h1{font-size:2.1rem;letter-spacing:.01em}
h2{font-size:1.25rem;letter-spacing:.02em;text-transform:uppercase}
.sub{color:var(--muted);margin:4px 0 0;max-width:68ch}
.num{font-variant-numeric:tabular-nums}

.controls{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:6px}
.ctl{display:flex;flex-direction:column;gap:4px;min-width:0}
.ctl label,.lbl{font-size:.72rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px 10px;min-width:210px;max-width:100%}
select:focus-visible,button:focus-visible,a:focus-visible,.cty:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.tabs{margin-top:12px}
.seg button{font:600 .95rem var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--ink);border-radius:999px;padding:8px 16px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:16px;align-items:start}
@media (max-width:820px){.main{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0}
.race-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:12px}
.race-head h2{font-size:1.7rem;text-transform:none}
.badge{font:700 .8rem var(--display);letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:4px;background:var(--rep);color:#fff}
.badge.dem{background:var(--dem);color:#fff}
.badge.na{background:var(--line);color:var(--ink)}
table{border-collapse:collapse;width:100%}
th{font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:right;padding:6px 8px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}
td.cand{font-weight:600;text-align:left}
.pty{display:inline-grid;place-items:center;width:22px;height:22px;border:1.5px solid currentColor;border-radius:3px;font:700 .8rem var(--display);margin-right:8px}
.pty.r{color:var(--rep)} .pty.d{color:var(--dem)} .pty.o{color:var(--muted)}
.bar{height:8px;background:var(--line);border-radius:2px;min-width:70px;overflow:hidden}
.bar i{display:block;height:100%}
.bar i.r{background:var(--rep)} .bar i.d{background:var(--dem)} .bar i.o{background:var(--muted)}
.note{font-size:.85rem;color:var(--muted);margin:10px 0 0}
.shiftline{margin-top:14px;padding:10px 12px;border-radius:4px;background:var(--bg);border:1px solid var(--line);font-size:.92rem}
.shiftline b{font-weight:600}
.tag{font-weight:700;font-variant-numeric:tabular-nums}
.tag.r{color:var(--rep)} .tag.d{color:var(--dem)}

.movers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
@media (max-width:480px){.movers{grid-template-columns:1fr}}
.movers h3{font-size:.95rem;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.movers ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.movers li{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.movers li:last-child{border-bottom:0}
.movers li button{all:unset;cursor:pointer;font-weight:500}
.movers li button:hover{text-decoration:underline}
.movers li button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.mapcard{position:relative}
.mapbox{position:relative}
svg.map{display:block;width:100%;height:auto;max-height:70vh}
.cty{stroke:var(--stroke);stroke-width:.9;stroke-linejoin:round;cursor:pointer;transition:fill .25s}
.cty.on{stroke:var(--ink);stroke-width:2.2}
.city circle{fill:var(--ink);stroke:var(--panel);stroke-width:1.5}
.city text{font:600 12px var(--body);fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-width:3px;stroke-linejoin:round}
.hover{width:100%;min-height:15rem;margin-bottom:12px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:10px 12px;font-size:.86rem}
.hover h3{font-size:1.15rem;margin-bottom:4px}
.hover .src{display:flex;justify-content:space-between;color:var(--muted);font-size:.72rem;margin-bottom:4px}
.hover table td,.hover table th{padding:3px 0}
.hover table th{border-bottom:1px solid var(--line);font-size:.66rem}
.hover td.cand{font-weight:500;white-space:nowrap}
.hover td:not(.cand){padding-left:8px}
.sw{display:inline-block;width:3px;height:.9em;margin-right:6px;vertical-align:-1px}
.sw.r{background:var(--rep)} .sw.d{background:var(--dem)} .sw.o{background:var(--muted)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 14px}
.split .half{min-width:0}
.split .half+.half{border-left:1px solid var(--line);padding-left:14px}
@media (max-width:560px){.split{grid-template-columns:minmax(0,1fr);gap:12px}.split .half+.half{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:10px}}
.role{font-size:.68rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.hm{margin-top:6px}
.hover td.cand{white-space:normal}
.hover .cmp{margin-top:6px;padding-top:6px;border-top:1px solid var(--line)}
.legend{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin-top:10px}
.ramp{display:flex;flex-direction:column;gap:3px}
.ramp div{display:flex;align-items:center;gap:8px;font-size:.78rem}
.ramp span.s{display:inline-flex}
.ramp span.s i{width:22px;height:12px;display:block}
.ticks{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);width:88px;margin-left:0}

.xp-head{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:12px}
.xp-ctls{display:flex;flex-wrap:wrap;gap:10px 16px}
.xc-row{padding:8px 0;border-bottom:1px solid var(--line);font-size:.88rem}
.xc-row .nm{font-weight:600;display:block;margin-bottom:4px}
.xc-line{display:grid;grid-template-columns:5.2rem minmax(0,1fr) 6.4rem;gap:8px;align-items:center;margin:3px 0}
.xc-line .who{font-size:.74rem;color:var(--muted);line-height:1.15}
.xc-line .nums{font-size:.78rem;text-align:right;white-space:nowrap}
.xc-diff{display:flex;justify-content:flex-end;font-size:.8rem;color:var(--muted);gap:6px}
@media (max-width:480px){.xc-line{grid-template-columns:4.2rem minmax(0,1fr) 5.6rem}}
input[type="search"]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px 10px;min-width:210px;max-width:100%}
input[type="search"]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.xp-more{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-top:12px;font-size:.88rem;color:var(--muted)}
.xp-more button{font:600 .9rem var(--body);color:var(--accent-ink);background:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:7px 16px;cursor:pointer}
.xp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px 20px}
.xp-g{min-width:0}
.xp-g h3{font-size:1rem;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;color:var(--muted)}
.xp-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:2px 10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:.88rem;align-items:center}
.xp-row .nm{overflow-wrap:anywhere}
.xp-row .sh{color:var(--muted);font-size:.78rem}
.xp-split{display:flex;height:10px;border-radius:2px;overflow:hidden;background:var(--line)}
.xp-split i{display:block;height:100%}
.xp-split i.d{background:var(--dem)} .xp-split i.r{background:var(--rep)}
.xp-nums{display:flex;justify-content:space-between;font-size:.8rem}
.xp-key{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;font-size:.82rem;color:var(--muted)}
.scope{font:700 .78rem var(--display);letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:4px;color:#fff}
.scope.nat{background:#8a5a00}.scope.fl{background:var(--muted);color:var(--panel)}
.method{margin-top:16px;padding:12px 14px;background:var(--bg);border:1px solid var(--line);border-radius:4px;font-size:.88rem}
.method h3{font-size:.95rem;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.method ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px;color:var(--muted)}
.method b{color:var(--ink);font-weight:600}
.src-list{display:flex;flex-direction:column;gap:12px;margin:12px 0 0;padding:0;list-style:none}
.src-list li{display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.src-list li:last-child{border-bottom:0;padding-bottom:0}
@media (max-width:600px){.src-list li{grid-template-columns:minmax(0,1fr)}}
.src-list .k{font-weight:600}
.src-list a{color:var(--ink);text-decoration-thickness:1px;text-underline-offset:2px;overflow-wrap:anywhere}
.chk{margin:0 0 4px;color:var(--muted);font-size:.88rem}
.caveats{margin:12px 0 0;padding-left:1.1em;color:var(--muted);font-size:.9rem;display:flex;flex-direction:column;gap:4px}
</style>

<div class="wrap">
  <header>
    <h1 id="h1">Florida County Compare</h1>
    <p class="sub" id="hsub"></p>
    <div class="seg tabs" role="group" aria-label="State" id="tabs"><button type="button" data-st="fl" aria-pressed="true">Florida</button><button type="button" data-st="mi" aria-pressed="false">Michigan</button></div>
  </header>

  <section class="controls" aria-label="Map controls">
    <div class="ctl"><label for="selView">Show election</label><select id="selView"></select></div>
    <div class="ctl"><label for="selCmp">Compare against</label><select id="selCmp"></select></div>
    <div class="ctl"><span class="lbl">Map view</span>
      <div class="seg" role="group" aria-label="Map view">
        <button type="button" id="btnLead" aria-pressed="true">County leader</button>
        <button type="button" id="btnShift" aria-pressed="false">Margin shift</button>
      </div>
    </div>
  </section>

  <div class="main">
    <section class="card" aria-live="polite">
      <div class="race-head"><h2 id="raceTitle"></h2><span class="badge" id="badge"></span></div>
      <table>
        <thead><tr><th>Candidate</th><th>Votes</th><th>Pct.</th><th></th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
      <p class="note" id="raceNote"></p>
      <div class="shiftline" id="shiftline"></div>
      <div class="movers" id="movers"></div>
    </section>

    <section class="card mapcard">
      <div class="mapbox">
        <div class="hover" id="hover" aria-live="polite"></div>
        <svg class="map" id="map" viewBox="0 0 640 618" role="img" aria-label="Map of Florida counties"></svg>
      </div>
      <div class="legend" id="legend"></div>
    </section>
  </div>

  <section class="card" id="exitpoll">
    <div class="xp-head">
      <div><h2>Who voted how: exit polls</h2><p class="sub" id="xpSub"></p></div>
      <div class="xp-ctls"><div class="ctl"><label for="selExit">Exit poll</label><select id="selExit"></select></div>
      <div class="ctl"><label for="selExitCmp">Compare side by side with</label><select id="selExitCmp"></select></div>
      <div class="ctl"><label for="xpFilter">Search breakdowns</label><input id="xpFilter" type="search" placeholder="age, party, Trump, prices"></div></div>
    </div>
    <div class="xp-key" id="xpKey"></div>
    <div class="xp-grid" id="xpGrid"></div>
    <div class="xp-more" id="xpMore"></div>
    <div class="method">
      <h3>How this data is handled</h3>
      <ul id="xpMethod"></ul>
    </div>
  </section>

  <section class="card">
    <h2>Sources to verify</h2>
    <p class="chk" id="check"></p>
    <ul class="src-list" id="sources"></ul>
    <ul class="caveats" id="caveats"></ul>
  </section>
</div>

const $ = id => document.getElementById(id);
const fmt = n => n.toLocaleString("en-US");
const pct = (a,b) => (b? a/b*100 : 0);
let keys = Object.keys(ELECTIONS);
let view="sen26", cmp="sen24", mode="lead", sel=null;

let counties = Object.keys(GEO.paths), cur = "fl";
const tot = k => { let r=0,d=0,t=0; for(const c of counties){const v=DATA[k][c]; r+=v[0]; d+=v[1]; t+=v[2];} return [r,d,t]; };
const margin = (k,c) => { const v=DATA[k][c]; return v[2]? (v[1]-v[0])/v[2]*100 : 0; };
const fm = m => (m>=0?"D+":"R+") + Math.abs(m).toFixed(1);
const fs = s => (s>=0?"D+":"R+") + Math.abs(s).toFixed(1);

function fillOptions(){
  $("selView").innerHTML = keys.map(k=>`<option value="${k}">${ELECTIONS[k].label}</option>`).join("");
  $("selView").value = view;
  $("selCmp").innerHTML = keys.filter(k=>k!==view).map(k=>`<option value="${k}">${ELECTIONS[k].label}</option>`).join("");
  $("selCmp").value = cmp;
}
function bin(v,cuts){ return v<cuts[0]?1: v<cuts[1]?2: v<cuts[2]?3:4; }
const LEAD_CUTS=[55,60,70], SHIFT_CUTS=[2,5,10];
function colorFor(c){
  if(mode==="lead"){
    const v=DATA[view][c]; if(!v[2]) return "var(--nodata)";
    const win=v[1]>v[0]?"d":"r"; const share=pct(Math.max(v[0],v[1]),v[2]);
    return `var(--${win}${bin(share,LEAD_CUTS)})`;
  }
  const s=margin(view,c)-margin(cmp,c);
  return `var(--${s>=0?"d":"r"}${bin(Math.abs(s),SHIFT_CUTS)})`;
}
function buildMap(){
  const svg=$("map");
  let h="";
  for(const c of counties) h+=`<path class="cty" data-c="${c}" tabindex="0" role="button" aria-label="${c} County" d="${GEO.paths[c]}"></path>`;
  h+=`<g class="city">`+Object.entries(GEO.cities).map(([n,[x,y]])=>{
    const left = ST[cur].leftCities.includes(n);
    const tx = left? x-9 : x+9; const anc = left? "end":"start";
    return `<circle cx="${x}" cy="${y}" r="3.5"></circle><text x="${tx}" y="${y+4}" text-anchor="${anc}">${n}</text>`;}).join("")+`</g>`;
  svg.innerHTML=h; svg.setAttribute("viewBox","0 0 "+GEO.w+" "+GEO.h); svg.setAttribute("aria-label","Map of "+ST[cur].name+" counties");
  if(svg._l) return; svg._l=1;
  svg.addEventListener("pointerover",e=>{const p=e.target.closest(".cty"); if(p) select(p.dataset.c);});
  svg.addEventListener("click",e=>{const p=e.target.closest(".cty"); if(p) select(p.dataset.c);});
  svg.addEventListener("focusin",e=>{const p=e.target.closest(".cty"); if(p) select(p.dataset.c);});
  svg.addEventListener("keydown",e=>{ if((e.key==="Enter"||e.key===" ")&&e.target.dataset.c){e.preventDefault(); select(e.target.dataset.c);} });
}
function paint(){
  document.querySelectorAll(".cty").forEach(p=>{p.style.fill=colorFor(p.dataset.c);});
}
function rampRow(label,pre,ticks){
  const sw=[1,2,3,4].map(i=>`<i style="background:var(--${pre}${i})"></i>`).join("");
  return `<div><span class="s">${sw}</span><span>${label}</span></div>`;
}
function legend(){
  if(mode==="lead"){
    $("legend").innerHTML=`<div class="ramp"><span class="lbl">Winner's vote share</span>${rampRow(ELECTIONS[view].R.replace("*",""),"r")}${rampRow(ELECTIONS[view].D.replace("*",""),"d")}<div class="ticks"><span>50</span><span>55</span><span>60</span><span>70%+</span></div></div>`;
  } else {
    $("legend").innerHTML=`<div class="ramp"><span class="lbl">Margin shift vs. ${ELECTIONS[cmp].label}</span>${rampRow("Moved toward Republicans","r")}${rampRow("Moved toward Democrats","d")}<div class="ticks"><span>0</span><span>2</span><span>5</span><span>10+ pts</span></div></div>`;
  }
}
function half(k,c,role){
  const E=ELECTIONS[k], v=DATA[k][c], o=v[2]-v[0]-v[1];
  const rows=[["d",E.D,v[1]],["r",E.R,v[0]],["o",E.O,o]].sort((a,b)=>b[2]-a[2]);
  const body=rows.map(([cl,n,x])=>`<tr><td class="cand"><span class="sw ${cl}"></span>${n}</td><td class="num">${fmt(x)}</td><td class="num">${pct(x,v[2]).toFixed(1)}%</td></tr>`).join("");
  const m=margin(k,c);
  return `<div class="half"><div class="role">${role}</div><div class="src"><span>${E.label}</span><span class="num">${fmt(v[2])} votes</span></div>
  <table><thead><tr><th>Candidate</th><th>Votes</th><th>Pct</th></tr></thead><tbody>${body}</tbody></table>
  <div class="hm">Margin <span class="tag ${m>=0?"d":"r"}">${fm(m)}</span></div></div>`;
}
function hoverCard(c){
  const m=margin(view,c), mb=margin(cmp,c), s=m-mb, cl=x=>x>=0?"d":"r";
  return `<h3>${c} County</h3><div class="split">${half(view,c,"Showing")}${half(cmp,c,"Compared to")}</div>
  <div class="cmp">Shift from ${ELECTIONS[cmp].label} to ${ELECTIONS[view].label}: <span class="tag ${cl(s)}">${fs(s)} pts</span></div>`;
}
function select(c){
  sel=c;
  document.querySelectorAll(".cty.on").forEach(p=>p.classList.remove("on"));
  const el=document.querySelector(`.cty[data-c="${c}"]`); if(el){el.classList.add("on"); el.parentNode.appendChild(el); const g=document.querySelector(".city"); if(g) el.parentNode.appendChild(g);}
  $("hover").innerHTML=hoverCard(c);
}
function renderLeft(){
  const E=ELECTIONS[view], [r,d,t]=tot(view), o=t-r-d;
  $("raceTitle").textContent=E.label.replace(/^(\d{4}) (.*)$/,ST[cur].name+" $2 $1");
  const win=d>r?"d":"r";
  const b=$("badge"); b.className="badge"+(win==="d"?" dem":"");
  b.textContent=(view==="sen26"?"":"")+(win==="d"?E.D:E.R).replace("*","")+" won";
  const rows=[["d",E.D,d,"D"],["r",E.R,r,"R"],["o",E.O,o,"I"]].sort((a,b)=>b[2]-a[2]);
  $("tbody").innerHTML=rows.map(([cl,n,x,p])=>`<tr><td class="cand"><span class="pty ${cl}">${p}</span>${n}</td><td class="num">${fmt(x)}</td><td class="num">${pct(x,t).toFixed(1)}%</td><td><div class="bar"><i class="${cl}" style="width:${pct(x,t).toFixed(1)}%"></i></div></td></tr>`).join("")+
    `<tr><td class="cand">Total</td><td class="num">${fmt(t)}</td><td></td><td></td></tr>`;
  $("raceNote").textContent=E.sub+(E.note?". "+E.note:".");
  const m=(d-r)/t*100, mb=(()=>{const [r2,d2,t2]=tot(cmp);return (d2-r2)/t2*100;})();
  const s=m-mb, cl=x=>x>=0?"d":"r";
  $("shiftline").innerHTML=`Statewide margin <span class="tag ${cl(m)}">${fm(m)}</span> vs. <span class="tag ${cl(mb)}">${fm(mb)}</span> in ${ELECTIONS[cmp].label}. Shift: <span class="tag ${cl(s)}">${fs(s)} pts</span>.`;
  const list=counties.filter(c=>DATA[view][c][2]>=25000).map(c=>[c,margin(view,c)-margin(cmp,c)]).sort((a,b)=>b[1]-a[1]);
  const li=a=>a.map(([c,s])=>`<li><button type="button" data-c="${c}">${c}</button><span class="tag ${cl(s)} num">${fs(s)}</span></li>`).join("");
  $("movers").innerHTML=`<div><h3>Most toward Democrats</h3><ol>${li(list.slice(0,5))}</ol></div><div><h3>Most toward Republicans</h3><ol>${li(list.slice(-5).reverse())}</ol></div>`;
  $("movers").querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>select(b.dataset.c)));
}
function renderSources(){
  $("check").textContent=ST[cur].check;
  $("sources").innerHTML=SOURCES.map(s=>`<li><span class="k">${s.k}</span><span>${s.links.map(([t,u])=>`<a href="${u}" target="_blank" rel="noopener">${t}</a>`).join("<br>")}</span></li>`).join("");
}
function render(){
  fillOptions();
  $("btnLead").setAttribute("aria-pressed",mode==="lead");
  $("btnShift").setAttribute("aria-pressed",mode==="shift");
  paint(); legend(); renderLeft();
  select(sel&&counties.includes(sel)?sel:ST[cur].defCounty);
}
$("selView").addEventListener("change",e=>{view=e.target.value; if(cmp===view) cmp=keys.find(k=>k!==view); render();});
$("selCmp").addEventListener("change",e=>{cmp=e.target.value; mode="shift"; render();});
$("btnLead").addEventListener("click",()=>{mode="lead"; render();});
$("btnShift").addEventListener("click",()=>{mode="shift"; render();});

   hsub:"The 2026 Florida Senate county map, with a dropdown to view past elections and measure how each county moved against them.",xpSub:"Exit poll results for Florida in 2024, 2020 and 2018 (Edison Research, as published by CNN), plus the 2026 midterms from MS NOW, which is a national poll and not Florida. Each row shows how a group split between the two main parties and how much of the electorate it made up.",method:["<b>Weighting:</b> These are the crosstabs as the pollster published them, and I did not re-weight anything. The 2020 total row (Biden 47.86, Trump 51.22) matches the actual Florida result, which suggests the figures were adjusted to the final vote. I have not seen a methodology statement that confirms it.","<b>Sample sizes:</b> CNN lists 3,293 total respondents for the 2024 Florida presidential poll, shown above the table. The 2020 and 2018 tables I could retrieve show only each group's share of voters, so there are no counts for those. Group-level counts are not published in any of them.","<b>Florida vs. national:</b> Every poll is marked. 2024, 2020, 2018 and the 2026 Senate and Governor entries are Florida electorates. The \"2026 Midterms (House vote)\" entry from MS NOW is national, a sample of voters across the U.S. voting for the U.S. House, credited to the Associated Press. Do not read that one as Florida. Neither 2026 source lists a respondent count or methodology.","<b>2026 Florida detail:</b> From NBC's expanded exit poll view on the Senate and Governor pages (data from the Associated Press), 161 breakdowns for the Senate race and 150 for the Governor race. NBC labels the tab \"National Exit Polls\", but the numbers fit Florida: white voters are 67% of the electorate, the questions name Moody, Nixon, Donalds and Jolly, and the splits work out to about 51% for Moody and 50% for Donalds. The percentages were read from bar chart labels by position in saved PDFs, and every Democratic and Republican pair adds up to about 100, but spot check a few against the live NBC page. No respondent count or methodology is listed.","<b>Estimated row:</b> The national poll has no 18\u201329 age group, so the \"18\u201329 (estimate)\" row combines its 18\u201324 and 25\u201329 rows, weighted by each group's share of voters (5% and 6%). It is an estimate built from rounded numbers, not a published figure, and it only exists so the national poll can line up with the Florida age bands. The 30\u201344 and 45\u201364 bands cannot be rebuilt this way.","<b>Not included:</b> 2022 (the saved CNN pages were the national House results, not Florida) and the 2024 Florida Senate poll. The 2026 table on Wikipedia is a commented-out placeholder borrowed from another state, so I left it out.","Small groups can be marked n/a where the pollster judged the sample too small."],caveats:["2026 numbers are unofficial election night results from the state, about 99% of expected votes in, and will move until counties certify.","Margin is Democratic share minus Republican share of all votes cast in the county. Shift is the 2026 margin minus the comparison margin, in percentage points. Turnout differs a lot between presidential and midterm years, so shifts against 2024 President read differently than shifts against 2022.","The governor races add up slightly differently from their statewide totals. The 2022 county rows sum to 4,614,418 for DeSantis and 3,106,328 for Crist, and the 2018 rows sum to 4,075,736 for DeSantis. Check the state's results archive before quoting exact numbers from those two."],check:"Statewide totals built from the county rows match the published figures: 2026 Moody 4,207,947 and Nixon 3,969,186 (same as the MS NOW card), 2024 Senate Scott 5,977,706, 2024 President Trump 6,110,125, 2022 Senate Rubio 4,474,847, 2020 President Trump 5,668,731 and Biden 5,297,045, 2018 Senate Scott 4,099,505 and Nelson 4,089,472, 2026 Governor Donalds 4,132,334 and Jolly 4,024,639."},

   hsub:"The 2026 Michigan Senate county map, with a dropdown to view past elections and measure how each county moved against them.",xpSub:"Exit poll results for Michigan: the 2026 Senate and Governor races from NBC News (data from the Associated Press), plus 2024, 2022 and 2020 from CNN and Edison Research as transcribed on Wikipedia. Each row shows how a group split between the two main candidates and how much of the electorate it made up.",method:["<b>Weighting:</b> These are the crosstabs as published, and I did not re-weight anything. I can't see how NBC, CNN or Edison weighted them.","<b>Sample sizes:</b> None of these tables show respondent counts, only each group's share of voters, so nothing here can be re-weighted from the raw sample.","<b>2026 detail:</b> From NBC's expanded exit poll view on the Michigan Senate and Governor pages (data from the Associated Press), 155 breakdowns for the Senate race and 144 for the Governor race. NBC labels the tab &quot;National Exit Polls&quot;, but the questions and candidates are Michigan's.","<b>Column check:</b> NBC lists the Democrat first. Averaging the Gender rows by each group's share of voters gives about 52% El-Sayed and 54% Benson, close to the actual 52.5% and 54.5%, which confirms the columns.","<b>Older polls:</b> The 2024 (Senate and President), 2022 Governor and 2020 President tables are as transcribed on Wikipedia from CNN and Edison. I did not compare them against CNN's own pages.","<b>Not included:</b> 2018 and the 2020 Senate race. I found no Michigan exit poll table for them.","Small groups can be marked n/a where the pollster judged the sample too small."],caveats:["2026 numbers are unofficial election night results as reported by NBC News, about 98% of expected votes in, and will move until counties certify.","Margin is Democratic share minus Republican share of all votes cast in the county. Shift is the 2026 margin minus the comparison margin, in percentage points. Turnout differs a lot between p
